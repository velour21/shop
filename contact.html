<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact - MiniBoutique</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="images/vb.jpg" alt="Logo MiniBoutique" class="logo">
    <h1>IEPA Shop</h1>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="produits.html">Produits</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contactez-nous</h2>
    <form action="https://formspree.io/f/mwpoydkn" method="post" class="contact-form">
      <label for="nom">Nom :</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">E-mail :</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message :</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Envoyer</button>
    </form>

    <section class="boutique-info">
      <h3>Notre Boutique</h3>
      <p>65 Rue Mayombe, talangai, Brazzaville</p>
      <img src="images/pa.jpg" alt="Notre boutique">
    </section>
  </main>

  <footer>
    <p>&copy; 2025 IEPA Shop. Tous droits réservés. père fondateur NKONO Christian</p>
  </footer>
</body>
</html>
